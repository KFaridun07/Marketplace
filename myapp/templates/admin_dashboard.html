
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #2d3142;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 55px 20px;
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 36px;
        }

        .header p {
            margin-top: 10px;
            color: #8a8f9d;
            font-size: 16px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 30px;
            text-decoration: none;
            color: #2d3142;
            box-shadow: 0 8px 30px rgba(30, 35, 50, 0.07);
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 35px rgba(30, 35, 50, 0.11);
        }

        .icon {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            background: #f0f1f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 22px;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .card p {
            margin: 0;
            color: #8a8f9d;
            line-height: 1.5;
        }

        .bottom {
            margin-top: 35px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            background: white;
            color: #2d3142;
            border: 1px solid #e5e7ed;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 650px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Administrator Dashboard</h1>
        <p>Manage users, categories, products and orders.</p>
    </div>

    <div class="dashboard">

        <a href="{% url 'admin_users' %}" class="card">
            <div class="icon">👥</div>
            <h2>Users</h2>
            <p>View and manage marketplace users.</p>
        </a>

        <a href="{% url 'admin_categories' %}" class="card">
            <div class="icon">📁</div>
            <h2>Categories</h2>
            <p>Create, edit and delete product categories.</p>
        </a>

        <a href="{% url 'admin_products' %}" class="card">
            <div class="icon">🛍️</div>
            <h2>Products</h2>
            <p>View and manage all marketplace products.</p>
        </a>

        <a href="{% url 'admin_orders' %}" class="card">
            <div class="icon">📦</div>
            <h2>Orders</h2>
            <p>View all orders and their details.</p>
        </a>

    </div>

    <div class="bottom">

        <a href="{% url 'home' %}" class="button">
            ← Marketplace
        </a>

    </div>

</div>

</body>
</html>
