
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #2d3142;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            color: #8a8f9d;
            margin-top: 8px;
        }

        .users {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-card {
            background: white;
            border-radius: 18px;
            padding: 20px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 7px 25px rgba(30, 35, 50, 0.06);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #eef0f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .username {
            font-size: 17px;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .view-button {
            padding: 10px 16px;
            background: #f0f1f5;
            color: #2d3142;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .delete-button {
            padding: 10px 16px;
            background: #fff1f1;
            color: #c85c5c;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .view-button:hover,
        .delete-button:hover {
            transform: translateY(-2px);
        }

        .navigation {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .navigation a {
            display: inline-block;
            padding: 12px 20px;
            background: white;
            color: #2d3142;
            border: 1px solid #e5e7ed;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .user-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions {
                width: 100%;
            }

            .view-button,
            .delete-button {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Users</h1>
        <p>Manage registered users of the marketplace.</p>
    </div>

    <div class="users">

        {% for user in users %}

            <div class="user-card">

                <div class="user-info">

                    <div class="avatar">
                        👤
                    </div>

                    <div class="username">
                        {{ user.username }}
                    </div>

                </div>

                <div class="actions">

                    <a href="{% url 'admin_user_detail' user.pk %}" class="view-button">
                        View Profile
                    </a>

                    <form method="post"
                          action="{% url 'admin_user_delete' user.pk %}">

                        {% csrf_token %}

                        <button type="submit" class="delete-button">
                            Delete
                        </button>

                    </form>

                </div>

            </div>

        {% empty %}

            <div class="user-card">
                <p>No users found.</p>
            </div>

        {% endfor %}

    </div>

    <div class="navigation">

        <a href="{% url 'admin_dashboard' %}">
            ← Dashboard
        </a>

        <a href="{% url 'home' %}">
            Marketplace
        </a>

    </div>

</div>

</body>
</html>
