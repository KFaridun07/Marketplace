
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #2d3142;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(30, 35, 50, 0.07);
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            margin: 10px 0 0;
            color: #8a8f9d;
        }

        .orders {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .order-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(30, 35, 50, 0.07);
            transition: 0.2s;
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(30, 35, 50, 0.10);
        }

        .order-number {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .info {
            margin: 10px 0;
            color: #686d7b;
        }

        .info strong {
            color: #2d3142;
        }

        .detail-button {
            display: inline-block;
            margin-top: 15px;
            padding: 11px 18px;
            border-radius: 12px;
            background: #2d3142;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .detail-button:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .empty {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            color: #8a8f9d;
            box-shadow: 0 8px 30px rgba(30, 35, 50, 0.06);
        }

        .navigation {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .navigation a {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 12px;
            background: white;
            color: #2d3142;
            border: 1px solid #e5e7ed;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .navigation a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 35, 50, 0.06);
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .header {
                padding: 24px;
            }

            h1 {
                font-size: 27px;
            }

            .orders {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Admin Orders</h1>
        <p class="subtitle">
            Manage all marketplace orders.
        </p>
    </div>

    {% if orders %}

        <div class="orders">

            {% for order in orders %}

                <div class="order-card">

                    <div class="order-number">
                        Order #{{ order.pk }}
                    </div>

                    <p class="info">
                        <strong>Owner:</strong>
                        {{ order.owner.username }}
                    </p>

                    <p class="info">
                        <strong>Total:</strong>
                        {{ order.total_price }}
                    </p>

                    <p class="info">
                        <strong>Date:</strong>
                        {{ order.cr_at }}
                    </p>

                    <a href="{% url 'admin_order_detail' order.pk %}"
                       class="detail-button">
                        View Detail
                    </a>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="empty">
            There are no orders yet.
        </div>

    {% endif %}

    <div class="navigation">

        <a href="{% url 'admin_dashboard' %}">
            ← Dashboard
        </a>

        <a href="{% url 'home' %}">
            Marketplace
        </a>

    </div>

</div>

</body>
</html>
