
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Detail</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #2d3142;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(30, 35, 50, 0.08);
        }

        .avatar-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
            border-radius: 50%;
            overflow: hidden;
            background: #f0f1f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-avatar {
            font-size: 45px;
        }

        .profile-card h1 {
            margin: 0 0 25px;
            font-size: 28px;
        }

        .info {
            background: #f7f8fc;
            border-radius: 15px;
            padding: 18px;
            text-align: left;
        }

        .info-row {
            padding: 10px 0;
        }

        .info-label {
            color: #8a8f9d;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 17px;
            font-weight: bold;
        }

        .navigation {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .navigation a {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 12px;
            background: white;
            color: #2d3142;
            border: 1px solid #e5e7ed;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .navigation a:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    {% include 'admin_navbar.html' %}

<div class="container">

    <div class="profile-card">

        {% if user.profile.avatar %}
            <div class="avatar-wrapper">
                <img src="{{ user.profile.avatar.url }}" alt="User avatar">
            </div>
        {% else %}
            <div class="avatar-wrapper">
                <div class="no-avatar">👤</div>
            </div>
        {% endif %}

        <h1>User Detail</h1>

        <div class="info">

            <div class="info-row">
                <div class="info-label">
                    Username
                </div>

                <div class="info-value">
                    {{ user.username }}
                </div>
            </div>

            <div class="info-row">
                <div class="info-label">
                    Full Name
                </div>

                <div class="info-value">
                    {{ user.profile.fullname }}
                </div>
            </div>

        </div>

    </div>

    <div class="navigation">

        <a href="{% url 'admin_users' %}">
            ← Users
        </a>

        <a href="{% url 'admin_dashboard' %}">
            Dashboard
        </a>

    </div>

</div>

</body>
</html>
