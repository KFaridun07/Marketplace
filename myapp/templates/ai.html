
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8fc;
            color: #2d3142;
        }

        .container {
            max-width: 850px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .ai-card {
            background: white;
            border-radius: 26px;
            padding: 40px;
            box-shadow: 0 12px 40px rgba(30, 35, 50, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: #f0f1f7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            margin-top: 10px;
            color: #8a8f9d;
            font-size: 15px;
        }

        form {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        input {
            flex: 1;
            padding: 15px 17px;
            border: 1px solid #e1e3ea;
            border-radius: 14px;
            outline: none;
            font-size: 15px;
            background: #fafbfc;
        }

        input:focus {
            border-color: #b9bdc9;
            background: white;
        }

        button {
            padding: 0 24px;
            border: none;
            border-radius: 14px;
            background: #2d3142;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .answer {
            margin-top: 30px;
            padding: 25px;
            border-radius: 18px;
            background: #f7f8fc;
            border: 1px solid #eceef3;
        }

        .answer-title {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .answer-text {
            margin: 0;
            line-height: 1.7;
            color: #555b6e;
            white-space: pre-wrap;
        }

        .navigation {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .navigation a {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 12px;
            background: white;
            color: #2d3142;
            border: 1px solid #e5e7ed;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        .navigation a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 35, 50, 0.06);
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .ai-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 27px;
            }

            form {
                flex-direction: column;
            }

            button {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="ai-card">

        <div class="header">

            <div class="icon">
                🤖
            </div>

            <h1>AI Assistant</h1>

            <p class="subtitle">
                Ask me about products in our marketplace.
            </p>

        </div>


        <form method="post">

            {% csrf_token %}

            <input
                type="text"
                name="question"
                placeholder="Ask something about our products..."
                required
            >

            <button type="submit">
                Ask AI
            </button>

        </form>


        {% if answer %}

            <div class="answer">

                <h2 class="answer-title">
                    AI Answer
                </h2>

                <p class="answer-text">
                    {{ answer }}
                </p>

            </div>

        {% endif %}

    </div>


    <div class="navigation">

        <a href="{% url 'home' %}">
            ← Marketplace
        </a>

        <a href="{% url 'products' %}">
            Products
        </a>

        <a href="{% url 'cart' %}">
            Cart
        </a>

    </div>

</div>

</body>
</html>
